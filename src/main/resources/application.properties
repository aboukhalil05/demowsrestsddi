# Nom de l'application Spring Boot
spring.application.name=demowsrestsddi

# Port sur lequel le serveur Tomcat intégré va démarrer (par défaut 8080, ici 8095)
server.port=8095


spring.datasource.url=jdbc:mysql://localhost:3306/WS-Spring?createDatabaseIfNotExist=true

# Nom d'utilisateur MySQL (par défaut root)
spring.datasource.username=root

# Mot de passe MySQL (à remplacer par votre mot de passe MySQL Workbench si vous en avez mis un)
spring.datasource.password=2005

# Affiche dans la console IntelliJ toutes les requêtes SQL générées par Hibernate
spring.jpa.show-sql=true

# Met à jour automatiquement les tables MySQL selon vos classes Java sans effacer les données existantes
spring.jpa.hibernate.ddl-auto=update

# Indique à Hibernate le langage SQL spécifique à utiliser (ici MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect